---
name: Bug report
about: Something truedemo does is wrong, or fails when it should not
title: "[bug] "
labels: bug
assignees: []
---

## What happened

A clear, concrete description of the wrong behaviour.

## What I expected

What should have happened instead.

## Reproduction

The smallest spec, provider, and command that shows it. A `video.yaml`
fragment plus the `truedemo` command line is ideal; a full story folder is
welcome if that is the minimum.

```yaml
# video.yaml
```

```bash
truedemo <verb> <spec>
```

## Evidence

The exact output — the error, the failing `verify.json` check, the
`doctor` report — not a paraphrase. "37 tests passed" is not evidence;
the command and its output is.

## Environment

- truedemo version (`truedemo --version`)
- Python version
- OS, and whether `ffmpeg` / `rsvg-convert` / `docker` / `bwrap` / Chromium
  are present (`truedemo doctor` prints this)
