[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "truedemo"
dynamic = ["version"]
description = "Create narrated, captioned demo videos of software — a real browser UI, a real terminal command, or a document it produces — from a declarative spec plus your own data; then reopen the .mp4 and verify every promise the spec made. Runs from a shell or an agent over MCP."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Anindyasundar Bera" }]
keywords = ["demo-video", "screencast", "video-generation", "playwright", "ffmpeg", "mcp"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Video",
  "Topic :: Software Development :: Documentation",
]

dependencies = [
  "PyYAML>=6.0.3,<7",       # YAML specs (JSON specs work without it)
]

[project.optional-dependencies]
capture = ["playwright>=1.63.0,<2"]
tts = ["piper-tts>=1.8.0,<2"]
mcp = ["mcp>=1.30.0,<3"]
dev = ["pytest>=9.1.1,<10", "pytest-cov>=7.1.0,<8", "ruff>=0.16.10,<1"]

[project.urls]
Homepage = "https://github.com/anindyasundarbera/truedemo"
Repository = "https://github.com/anindyasundarbera/truedemo"
Issues = "https://github.com/anindyasundarbera/truedemo/issues"
Changelog = "https://github.com/anindyasundarbera/truedemo/blob/main/CHANGELOG.md"

[project.scripts]
truedemo = "truedemo.cli:main"
truedemo-mcp = "truedemo.mcp_server:main"

[tool.setuptools.dynamic]
version = {attr = "truedemo._version.__version__"}

[tool.setuptools.packages.find]
include = ["truedemo*"]

[tool.setuptools]

[tool.setuptools.package-data]
truedemo = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
# Optional extras (playwright, mcp) and PyYAML are not installed in the lean
# environment that runs the type check, and their stubs are not declared as
# dependencies. The type gate is advisory (non-blocking) to start — it surfaces
# drift without failing a build whose real contract is the test suite.
ignore_missing_imports = true
# The engine is typed deliberately but not exhaustively; these are the two
# highest-signal categories to surface first. Expand this set (see DECISIONS.md)
# as the codebase tightens, not by bumping mypy's defaults.
check_untyped_defs = true
warn_unused_ignores = false
